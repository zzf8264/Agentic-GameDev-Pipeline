# =============================================================================
# Agentic GameDev Pipeline — Docker Compose
# =============================================================================
# Usage:
#   docker compose up
#   DRY_RUN=true docker compose run pipeline
# =============================================================================

services:
  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: gamedev-pipeline
    environment:
      LLM_ENDPOINT: "http://host.docker.internal:11434/v1"
      LLM_MODEL: "qwen2.5:7b"
      LLM_MAX_TOKENS: "8192"
      DRY_RUN: "false"
      LOG_LEVEL: "INFO"
      MAX_SELF_HEAL_ITERATIONS: "3"
      SCOUT_PLATFORM: "douyin"
      SCOUT_HASHTAGS: "超解压三消,益智游戏开发,cocoscreator"
      GAME_MECHANIC: "match-3"
    volumes:
      - ./agents:/app/agents
      - ./core:/app/core
      - ./prompts:/app/prompts
      - ./orchestrator.py:/app/orchestrator.py
      - ./requirements.txt:/app/requirements.txt
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"
